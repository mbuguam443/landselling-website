{% extends 'base_admin.html' %}
{% load static %}

{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="glassmorphism rounded-xl p-8 glow-border">
        <h2 class="text-2xl font-bold text-white mb-6">{{ title }}</h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-sm font-medium mb-1" style="color: #b0b0d0;">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <p class="text-sm mt-1" style="color: #ff1744;">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}
            <div class="flex gap-3 pt-4">
                <button type="submit" class="btn-primary py-2">Save</button>
                <a href="{% url 'subscriptions:plan_list' %}" class="btn-secondary py-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

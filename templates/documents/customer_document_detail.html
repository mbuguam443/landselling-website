{% extends 'base_customer.html' %}
{% load static %}
{% load currency_filters %}

{% block page_title %}Document Details{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="glassmorphism rounded-xl p-8 glow-border">
        <div class="flex items-center gap-3 mb-6">
            <svg class="w-8 h-8" style="color: #00ff99;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <h3 class="text-xl font-semibold text-white">{{ doc.title }}</h3>
        </div>
        <div class="space-y-4 text-sm">
            <div class="flex justify-between py-2 border-b" style="border-color: #2a1a4a;">
                <span style="color: #4a4a6a;">Type</span>
                <span class="text-white">{{ doc.get_document_type_display }}</span>
            </div>
            <div class="flex justify-between py-2 border-b" style="border-color: #2a1a4a;">
                <span style="color: #4a4a6a;">Date</span>
                <span class="text-white">{{ doc.created_at|date }}</span>
            </div>
        </div>
        <div class="mt-6 flex gap-3">
            <a href="{{ doc.file.url }}" target="_blank" class="btn-primary text-sm py-2">View Document</a>
            <a href="{% url 'documents:document_list' %}" class="text-sm py-2 px-4 rounded-full" style="color: #00ffff; border: 1px solid #00ffff;">Back</a>
        </div>
    </div>
</div>
{% endblock %}

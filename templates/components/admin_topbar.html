<header class="h-16 flex-shrink-0 border-b flex items-center justify-between px-4 lg:px-6" style="background: #0a0015; border-color: #2a1a4a;">
    <div class="flex items-center gap-3">
        <button onclick="toggleSidebar('adminSidebar', 'adminSidebarOverlay')" class="lg:hidden p-2 rounded-lg hover:bg-primary/10 text-white focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
            <h1 class="text-lg font-semibold text-white">{% block page_title %}Dashboard{% endblock %}</h1>
            {% block breadcrumbs %}{% endblock %}
        </div>
    </div>
    <div class="flex items-center gap-4">
        <a href="{% url 'notifications:notification_list' %}" class="relative text-muted-foreground hover:text-white transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            {% if unread_count > 0 %}
            <span class="absolute -top-1 -right-1 w-4 h-4 bg-destructive rounded-full text-xs flex items-center justify-center" style="background: #ff1744; color: white; font-size: 10px;">{{ unread_count }}</span>
            {% endif %}
        </a>
        <div class="flex items-center gap-2 text-sm">
            <div class="w-8 h-8 rounded-full" style="background: linear-gradient(135deg, #00ff99, #00ffff); display: flex; align-items: center; justify-content: center;">
                <span class="text-xs font-semibold" style="color: #0a0015;">{{ user.first_name|first|default:user.username|first|upper }}</span>
            </div>
            <div class="hidden md:block">
                <p class="text-white text-sm font-medium">{{ user.get_full_name|default:user.username }}</p>
                <p class="text-xs" style="color: #4a4a6a;">{{ user.get_role_display }}</p>
            </div>
        </div>
        <a href="{% url 'accounts:logout' %}" class="text-sm text-muted-foreground hover:text-white transition">Logout</a>
    </div>
</header>

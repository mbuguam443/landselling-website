<form method="get" class="flex flex-wrap items-end gap-3 mb-4">
    <div class="flex-1 min-w-[200px]">
        <label class="block text-xs font-semibold uppercase tracking-wider mb-1" style="color: #4a4a6a;">Search</label>
        <input type="text" name="search" value="{{ search|default:'' }}" placeholder="Search..." class="w-full px-3 py-2 rounded-lg text-sm" style="background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1);">
    </div>
    {% if filter_form %}
    <div>
        <label class="block text-xs font-semibold uppercase tracking-wider mb-1" style="color: #4a4a6a;">Filter</label>
        {{ filter_form }}
    </div>
    {% endif %}
    {% if sort_field %}
    <input type="hidden" name="sort" value="{{ sort_field }}">
    <input type="hidden" name="order" value="{{ sort_order }}">
    {% endif %}
    <div class="flex gap-2">
        <button type="submit" class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200" style="background: rgba(0,255,153,0.1); color: #00ff99; border: 1px solid rgba(0,255,153,0.3);">Apply</button>
        <a href="?" class="px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200" style="background: rgba(255,255,255,0.05); color: #8888aa; border: 1px solid rgba(255,255,255,0.1);">Clear</a>
    </div>
</form>

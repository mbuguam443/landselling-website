{% extends 'base_admin.html' %}
{% load static %}
{% load currency_filters %}

{% block page_title %}Confirm Delete{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="glassmorphism rounded-xl p-8 glow-border" style="border-color: #ff1744;">
        <div class="text-center">
            <svg class="w-16 h-16 mx-auto mb-4" style="color: #ff1744;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/>
            </svg>
            <h2 class="text-2xl font-bold text-white mb-2">Confirm Delete</h2>
            <p class="mb-6" style="color: #b0b0d0;">Are you sure you want to delete "{{ object }}"? This action cannot be undone.</p>
            <form method="post" class="flex gap-3 justify-center">
                {% csrf_token %}
                <button type="submit" class="py-2 px-6 rounded-full font-semibold cursor-pointer" style="background: #ff1744; color: white;">Delete</button>
                <a href="javascript:history.back()" class="btn-secondary py-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
